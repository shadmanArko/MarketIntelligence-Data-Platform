# Weekly update proposals, each as a pull request that must pass CI. Minor/patch updates are grouped.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/docker/postgres, /deploy/collector]
    schedule: {interval: weekly, day: monday}
