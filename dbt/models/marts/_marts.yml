version: 2

models:
  - name: content_performance
    columns:
      - name: post_id
        tests: [unique, not_null]
      - name: perf_pct_in_peer
        tests: [{between: {min_value: 0, max_value: 1}}]

  - name: occasion_content_calendar
    tests:
      - unique_combination: {columns: [day, community_id, occasion_type]}

  - name: content_feature_performance
    tests:
      - unique_combination: {columns: [platform, tag_type, tag_id]}

