name: mip
version: "0.1.0"
config-version: 2
profile: mip
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  market_id: berlin-food
  # Berlin wall-clock for marts; everything stored is UTC
  local_tz: Europe/Berlin

models:
  mip:
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    ml:
      +schema: ml
      +materialized: table
seeds:
  mip:
    +schema: core
