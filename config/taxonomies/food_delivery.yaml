# Unified taxonomy for the food_delivery vertical.
# cuisines: canonical id -> parent group + platform tags / OSM cuisine values / words that map to it.
# dishes:   canonical dish -> patterns matched against normalised menu item names (lowercase, umlauts folded).
# `mip taxonomy export` writes dbt/seeds/cuisine_map.csv and dish_map.csv from this file.
vertical: food_delivery

