  new_year: [new year, neujahr, silvester, new years eve, guten rutsch, новый год, yılbaşı]
  easter: [easter, ostern, pascha, πάσχα, пасха]
  thanksgiving: [thanksgiving]
  karneval_der_kulturen: [karneval der kulturen]
  national_day: [independence day, victory day, bijoy dibosh, বিজয় দিবস, স্বাধীনতা দিবস, cumhuriyet bayramı, tag der deutschen einheit, republic day]
