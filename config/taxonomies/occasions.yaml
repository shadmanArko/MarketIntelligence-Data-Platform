  bengali_new_year: [pohela boishakh, পহেলা বৈশাখ, noboborsho, নববর্ষ, boishakh]
  durga_puja: [durga puja, দুর্গা পূজা, dussehra, dashami, navratri, नवरात्रि, दशहरा, bijoya]
  diwali: [diwali, deepavali, दिवाली, दीपावली, দীপাবলি, tihar]
