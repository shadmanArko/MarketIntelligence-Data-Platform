# Berlin "meat + rice" audiences: who they are, how many live in Berlin, which language and script reaches them,
# which of their own meat-and-rice dishes biryani can be tied to, and the greeting for each occasion type.
# Source of truth for the content / audience datasets (Wikidata only seeds dish names; this file is curated).
#
#   countries      ISO-3166 alpha-2; their national + religious holidays come from python-holidays per year
#   afs_citizenship  exact labels in Amt für Statistik Berlin-Brandenburg A I 5, sheet T10 (citizenship, Berlin)
#   afs_origin       origin-area codes in A I 16 sheet T4 (migration background per LOR planning area); only 24 exist
#   moon_offset      days South-Asian / moon-sighting communities usually celebrate Islamic feasts after Umm al-Qura
#   greetings        occasion_type -> native text | transliteration. review: true = check with a native speaker
#   religion_mix     rough, for choosing occasions (not a statistic)
#
# Occasion types are defined in occasions.yaml; python-holidays names are mapped there.

communities:
  bangladeshi:
    label: Bangladeshi
    countries: [BD]
    afs_citizenship: [Bangladesch]
    afs_origin: []
    languages: [bn, en, de]
    scripts: [Beng]
    religion_mix: [muslim, hindu]
    moon_offset: 1
    dishes:
      - { id: kacchi_biryani, native: কাচ্চি বিরিয়ানি, translit: kacchi biriyani, en: kacchi biryani (raw-marinated mutton dum biryani) }
      - { id: tehari, native: তেহারি, translit: tehari, en: beef tehari }
      - { id: morog_polao, native: মোরগ পোলাও, translit: morog polao, en: chicken polao }
      - { id: khichuri, native: খিচুড়ি, translit: khichuri, en: khichuri with beef (rainy days) }
    greetings:
      eid_al_fitr: { text: ঈদ মোবারক, translit: Eid Mubarak }
      eid_al_adha: { text: ঈদ মোবারক, translit: Eid Mubarak }
      ramadan: { text: রমজান মোবারক, translit: Ramadan Mubarak }
      bengali_new_year: { text: শুভ নববর্ষ, translit: Shubho Noboborsho }
      national_day: { text: বিজয় দিবসের শুভেচ্ছা, translit: Bijoy Dibosher Shubhechchha }
      durga_puja: { text: শুভ বিজয়া, translit: Shubho Bijoya }
      mother_language_day: { text: অমর একুশে, translit: Amar Ekushe }

