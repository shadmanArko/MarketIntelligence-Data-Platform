      - { id: lucknowi_biryani, native: लखनवी बिरयानी, translit: Lucknowi biryani, en: Awadhi biryani }
      - { id: kolkata_biryani, native: কলকাতা বিরিয়ানি, translit: Kolkata biriyani, en: Kolkata biryani with potato }
      - { id: malabar_biryani, native: മലബാർ ബിരിയാണി, translit: Malabar biriyani, en: Malabar biryani }
