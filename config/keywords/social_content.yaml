# Search queries for social-content collection (YouTube search.list today; Threads / Instagram hashtag search and
# X recent search use the same list once those APIs are approved). Every community's own dish names are added
# automatically from config/taxonomies/communities.yaml (native + transliteration).
#
#   region  YouTube regionCode bias; lang = relevanceLanguage; tier 1 = searched first every cycle
