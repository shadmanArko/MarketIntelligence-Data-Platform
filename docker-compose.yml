services:
  postgres:
    build: ./docker/postgres
    image: mip-postgres:18
    container_name: mip-postgres
    shm_size: 1gb            # parallel hash joins need more than Docker's 64 MB /dev/shm
    environment:
      POSTGRES_USER: mip
      POSTGRES_PASSWORD: mip
      POSTGRES_DB: mip
    ports:
      - "5434:5432"
    volumes:
      - mip-pgdata:/var/lib/postgresql
    command: >
      postgres -c shared_buffers=1GB -c work_mem=64MB -c maintenance_work_mem=512MB
               -c max_wal_size=4GB -c effective_cache_size=4GB -c io_method=worker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mip -d mip"]
      interval: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mip-pgdata:
