[project]
name = "mip"
version = "0.1.0"
description = "Market Intelligence Data Platform — public business, menu, social, web and search data into clean ML-ready datasets"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "pyyaml>=6",
  "psycopg[binary,pool]>=3.3.6",
  "typer>=0.27.3",
  "rich>=13",
  "structlog>=24",
  "orjson>=3.13.0",
  "httpx[http2]>=0.28.1",
  "curl_cffi>=0.7",
  "h3>=4.1",
  "shapely>=2.2.0",
  "duckdb>=1.1",
  "polars>=1.9",
  "pyarrow>=17",
  "rapidfuzz>=3.10",
  "unidecode>=1.3",
  "tldextract>=5.4.0",
  "trafilatura>=2.3.1",
  "extruct>=0.17",
  "playwright>=1.64.1",
  "huggingface_hub>=2.3.0",
  "osmium>=4.3.2",
  "splink>=4.0",
  "instaloader>=4.15.4",
  "yt-dlp>=2026.10.21",
  "lingua-language-detector>=2.0",
  "holidays>=0.107",
  "convertdate>=2.5.1",
  "kaggle>=2.2.5",
  "hijridate>=2.6.0",
  "persiantools>=6.2.0",
  "lunardate>=0.3.0",
  "openpyxl>=3.1.5",
  "astral>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.2", "pyright>=1.1.385", "sqlfluff>=3.2", "dbt-core>=1.12.6", "dbt-postgres>=1.9"]

[project.scripts]
mip = "mip.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
